<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#bgGradient)" rx="15" ry="15"/>
  
  <!-- Border -->
  <rect x="5" y="5" width="290" height="390" fill="none" stroke="url(#goldGradient)" stroke-width="5" rx="12" ry="12"/>
  
  <!-- Character Silhouette -->
  <g transform="translate(150, 200)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="40" fill="#f5f5dc" filter="url(#shadow)"/>
    
    <!-- Body -->
    <rect x="-30" y="-40" width="60" height="80" fill="#f5f5dc" rx="10" ry="10" filter="url(#shadow)"/>
    
    <!-- Arms -->
    <rect x="-50" y="-30" width="20" height="60" fill="#f5f5dc" rx="10" ry="10" filter="url(#shadow)"/>
    <rect x="30" y="-30" width="20" height="60" fill="#f5f5dc" rx="10" ry="10" filter="url(#shadow)"/>
    
    <!-- Legs -->
    <rect x="-25" y="40" width="15" height="50" fill="#f5f5dc" rx="7" ry="7" filter="url(#shadow)"/>
    <rect x="10" y="40" width="15" height="50" fill="#f5f5dc" rx="7" ry="7" filter="url(#shadow)"/>
    
    <!-- Face Features -->
    <circle cx="-10" cy="-85" r="3" fill="#2c1810"/>
    <circle cx="10" cy="-85" r="3" fill="#2c1810"/>
    <path d="M -5 -75 Q 0 -70 5 -75" stroke="#2c1810" stroke-width="2" fill="none"/>
    
    <!-- Hair -->
    <path d="M -35 -120 Q -25 -130 0 -125 Q 25 -130 35 -120 Q 30 -110 0 -115 Q -30 -110 -35 -120 Z" fill="#8b4513"/>
    
    <!-- Code Symbols -->
    <text x="-20" y="-60" font-family="monospace" font-size="8" fill="#d4af37" text-anchor="middle">&lt;/&gt;</text>
    <text x="20" y="-50" font-family="monospace" font-size="6" fill="#d4af37" text-anchor="middle">{}</text>
    <text x="0" y="-30" font-family="monospace" font-size="7" fill="#d4af37" text-anchor="middle">()</text>
  </g>
  
  <!-- Decorative Elements -->
  <g fill="url(#goldGradient)" opacity="0.3">
    <!-- Corner decorations -->
    <path d="M 20 20 L 30 20 L 30 30 L 20 30 Z"/>
    <path d="M 270 20 L 280 20 L 280 30 L 270 30 Z"/>
    <path d="M 20 370 L 30 370 L 30 380 L 20 380 Z"/>
    <path d="M 270 370 L 280 370 L 280 380 L 270 380 Z"/>
  </g>
  
  <!-- Title Text -->
  <text x="150" y="350" font-family="serif" font-size="14" fill="#d4af37" text-anchor="middle" font-weight="bold">Code Sage</text>
</svg> 