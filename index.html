---
layout: default
title: "RPG Character Page"
description: "Interactive RPG character showcase with medieval fantasy theme"
---

<div class="container">
    <div class="character-sheet">
        <!-- Character Header -->
        <div class="character-header">
            <h1 class="character-name">Loading...</h1>
            <div class="character-class">Loading...</div>
            <div class="character-title">Loading...</div>
        </div>
        
        <!-- Character Portrait -->
        <div class="character-portrait">
            <img src="{{ '/assets/images/character-portrait.svg' | relative_url }}" 
                 alt="Character Portrait - Davide the Code Sage" 
                 class="portrait-image"
                 width="300" 
                 height="400">
        </div>
        
        <!-- Stats Section -->
        <section class="stats-section">
            <h2>Character Stats</h2>
            <div class="stats-grid">
                <!-- Stats will be populated by JavaScript -->
            </div>
        </section>
        
        <!-- Skills Section -->
        <section class="skills-section">
            <h2>Skills & Abilities</h2>
            <div class="skills-list">
                <!-- Skills will be populated by JavaScript -->
            </div>
        </section>
        
        <!-- Equipment Section -->
        <section class="equipment-section">
            <h2>Equipment & Tools</h2>
            <div class="equipment-grid">
                <!-- Equipment will be populated by JavaScript -->
            </div>
        </section>
        
        <!-- Lore Section -->
        <section class="lore-section">
            <h2>Character Lore</h2>
            <div class="lore-content">
                <!-- Lore will be populated by JavaScript -->
            </div>
        </section>
    </div>
</div>
